[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slm-from-scratch"
version = "0.1.0"
description = "Train a 100M+ parameter small language model with 12k context on a 4060 Ti"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "datasets>=2.16",
  "tokenizers>=0.15",
  "pyyaml>=6.0",
  "tqdm>=4.66",
  "numpy>=1.26"
]

[tool.setuptools]
packages = ["slm", "data_pipeline"]

[tool.black]
line-length = 100
