model:
  vocab_size: 32768
  d_model: 768
  n_layers: 14
  n_heads: 12
  n_kv_heads: 4
  ffn_hidden: 2048
  max_seq_len: 12288
  rope_theta: 1000000.0
  dropout: 0.0

train:
  batch_size: 1
  grad_accum_steps: 32
  lr: 3.0e-4
  min_lr: 3.0e-5
  weight_decay: 0.1
  warmup_steps: 1000
  max_steps: 20000
  precision: bf16
  compile: false
  checkpoint_every: 500
  log_every: 10
  min_params_million: 100.0

data:
  approved_registry: data/approved_datasets.yaml
  dataset_name: wikitext
  dataset_config: wikitext-103-v1
  split: train
  text_key: text
  local_text_path: artifacts/clean/train_clean.txt
  tokenizer_path: artifacts/tokenizer.json
  tokenized_path: artifacts/train_tokens.npy
